services:
  mcphub:
    image: huangjunsen/xiaozhi-mcphub:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_URL: "sqlite:/app/data/mcphub.sqlite"
      SMART_ROUTING_ENABLED: "false"
      # Set a long random secret for production deployments.
      # JWT_SECRET: "replace-with-a-long-random-secret"
      # Optional; only used when creating the first admin in an empty user store.
      # ADMIN_PASSWORD: "replace-with-a-strong-password"
      # BASE_PATH: "/mcphub"
    volumes:
      # Keep the database, WAL and shared-memory sidecars together across restarts.
      - sqlite-data:/app/data

volumes:
  sqlite-data:
